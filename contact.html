<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Ashlon Frank</title>
    <meta name="description" content="Get in touch with Ashlon Frank" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="nav-shell">
      <div class="page">
        <header class="nav" aria-label="Site navigation">
          <a class="nav__brand" href="./index.html">Ashlon Frank</a>
          <span class="nav__role">Product Designer</span>
          <div class="nav__end">
            <ul class="nav__links">
              <li><a class="nav__link" href="./about.html">About</a></li>
              <li><a class="nav__link" href="./contact.html" aria-current="page">Contact</a></li>
            </ul>
          </div>
        </header>
      </div>
    </div>

    <div class="page">
      <section class="reach-out" aria-labelledby="reach-out-title">
        <h1 class="reach-out__title" id="reach-out-title">Reach out!</h1>
        <p class="reach-out__lede">I'd like to hear from you.</p>
        <p class="reach-out__body">
          Whether you're looking to collaborate on a new project, want to hire me, or simply say hello.
        </p>
        <div class="reach-out__contacts">
          <a class="reach-out__email" id="contact-email" href=""></a>
          <a
            class="reach-out__linkedin"
            id="contact-linkedin"
            href=""
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          ></a>
        </div>
      </section>

      <footer class="footer footer--static">
        <div class="footer__peek">
          <div class="footer__peek-inner">
            <p class="footer__note">2026 Portfolio</p>
            <a class="footer__social-link" id="footer-linkedin" href="" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"></a>
            <div class="footer__credit-wrap">
              <span class="footer__email-group">
                <button type="button" class="footer__copy" id="footer-copy" aria-label="Copy email address">
                  <svg class="footer__copy-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                    <rect x="4" y="4" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1" />
                    <path d="M3 8V2.5A.5.5 0 0 1 3.5 2H8" fill="none" stroke="currentColor" stroke-width="1" />
                  </svg>
                </button>
                <a class="footer__credit" id="footer-email" href=""></a>
              </span>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script src="./js/contact.js" type="module"></script>
  </body>
</html>
